<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Beta Lab</title>
    <link rel="stylesheet" href="{% static "css/styles.css" %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            position: relative;
            overflow: hidden;
        }

        .error-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="1.5" fill="rgba(255,255,255,0.1)"/></svg>');
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .error-container {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
            max-width: 600px;
            padding: var(--spacing-xl);
        }

        .error-code {
            font-family: var(--font-primary);
            font-size: 8rem;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
            background: linear-gradient(45deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: bounce 2s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        .error-title {
            font-family: var(--font-primary);
            font-size: var(--font-size-3xl);
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
            opacity: 0.95;
        }

        .error-message {
            font-family: var(--font-secondary);
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-2xl);
            opacity: 0.8;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--border-radius-md);
            font-family: var(--font-secondary);
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition-normal) var(--ease-in-out);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            border: 2px solid transparent;
        }

        .error-btn-primary {
            background: white;
            color: var(--color-primary);
        }

        .error-btn-primary:hover {
            background: var(--color-gray-100);
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .error-btn-secondary {
            background: transparent;
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        .error-btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
            transform: translateY(-3px);
        }

        .error-illustration {
            margin-bottom: var(--spacing-xl);
            opacity: 0.7;
        }

        .error-illustration i {
            font-size: 6rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: var(--font-size-2xl);
            }
            
            .error-message {
                font-size: var(--font-size-md);
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .error-btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-illustration">
                <i class="fas fa-search"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for seems to have vanished into the digital void. 
                Don't worry, even the best researchers sometimes take a wrong turn.
            </p>
            <div class="error-actions">
                <a href="{% url 'labo:home' %}" class="error-btn error-btn-primary">
                    <i class="fas fa-home"></i>
                    Back to Home
                </a>
                <a href="{% url 'labo:contact' %}" class="error-btn error-btn-secondary">
                    <i class="fas fa-envelope"></i>
                    Contact Us
                </a>
            </div>
        </div>
    </div>

    <script>
        // Animation de particules simple
        document.addEventListener('DOMContentLoaded', function() {
            const errorPage = document.querySelector('.error-page');
            
            // Créer des particules flottantes
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: absolute;
                    width: ${Math.random() * 4 + 2}px;
                    height: ${Math.random() * 4 + 2}px;
                    background: rgba(255,255,255,0.3);
                    border-radius: 50%;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation: floatParticle ${Math.random() * 10 + 10}s linear infinite;
                    pointer-events: none;
                `;
                errorPage.appendChild(particle);
            }
        });

        // CSS pour l'animation des particules
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatParticle {
                0% {
                    transform: translateY(100vh) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 1;
                }
                90% {
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
